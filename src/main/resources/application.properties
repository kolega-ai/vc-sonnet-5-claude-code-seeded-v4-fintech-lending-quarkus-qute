# Loan Origination Portal - configuration
# All secrets/credentials are supplied via environment variables; no secrets committed here.

quarkus.application.name=loan-origination-portal

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:loanportal}
quarkus.datasource.password=${DB_PASSWORD:loanportal_dev_pw}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/loanportal}

# --- Hibernate ORM ---
# Flyway owns the schema; Hibernate must never auto-generate DDL.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# --- HTTP ---
quarkus.http.port=${APP_PORT:8080}
quarkus.http.host=0.0.0.0
%dev.quarkus.http.port=8080

# Body/upload limits
quarkus.http.limits.max-body-size=25M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=${UPLOAD_TMP_DIR:/tmp/loanportal-uploads-tmp}
quarkus.http.body.delete-uploaded-files-on-end=true

# --- Sessions / cookies ---
# Form-based session auth is implemented with a custom signed session cookie (see security package).
app.session.cookie-name=lop_session
app.session.secret=${SESSION_SECRET:dev-only-session-secret-change-me-please-32bytes}
app.session.ttl-minutes=60

# --- File storage ---
app.upload.base-dir=${UPLOAD_BASE_DIR:./data/uploads}

# --- Password reset ---
app.reset-token.ttl-minutes=30

# --- Misc / non-scoring precision baselines ---
app.asset.cdn-base=/static

quarkus.log.level=INFO
%prod.quarkus.log.level=DEBUG
quarkus.log.category."com.loanportal".level=DEBUG

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${DB_USER:loanportal}
%test.quarkus.datasource.password=${DB_PASSWORD:loanportal_dev_pw}
%test.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/loanportal_test}
%test.quarkus.flyway.migrate-at-start=true

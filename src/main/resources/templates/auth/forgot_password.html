{@java.lang.String message}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Loan Origination Portal</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>Reset your password</h1>
      <p class="muted">We'll send a single-use reset link if the address is registered.</p>
      {#if message}<div class="alert alert-info">{message}</div>{/if}
      <form method="post" action="/forgot-password" class="stack">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required autofocus></div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <p style="margin-top:1rem; font-size:.85rem;"><a href="/login">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>

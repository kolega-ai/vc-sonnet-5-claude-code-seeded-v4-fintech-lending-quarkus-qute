{@java.lang.String token}
{@java.lang.String error}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose new password - Loan Origination Portal</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>Choose a new password</h1>
      {#if error}<div class="alert alert-danger">{error}</div>{/if}
      <form method="post" action="/reset-password" class="stack">
        <input type="hidden" name="token" value="{token}">
        <div class="form-group"><label for="password">New password</label><input type="password" id="password" name="password" minlength="10" required autofocus></div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
      <p style="margin-top:1rem; font-size:.85rem;"><a href="/login">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
